{% load static %}
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>smsar_egy | تم تأكيد الحجز</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--gold:#D4A72C}
html,body{width:100%;height:100%;overflow:hidden}
body{font-family:Arial,sans-serif;background:#030303;color:#fff}

.scene{
    position:relative;
    width:100vw;
    height:100vh;
    overflow:hidden;
    background:#030303;
}

/* الخلفية */
.entry{
    position:absolute;
    inset:0;
    background:
        radial-gradient(ellipse at 50% 45%,#493018 0,#17110a 38%,#020202 78%);
}

.entry:after{
    content:"";
    position:absolute;
    inset:0;
    background:linear-gradient(90deg,rgba(0,0,0,.72),transparent 45%,rgba(0,0,0,.72));
}

/* إطار الباب — المفصلة ناحية الشمال */
.door-frame{
    position:absolute;
    left:50%;
    top:48%;
    width:min(76vw,400px);
    height:min(78vh,620px);
    transform:translate(-50%,-50%);
    background:#090909;
    border:7px solid #151515;
    box-shadow:0 0 0 2px rgba(212,167,44,.55),0 30px 90px #000;
}

/* الباب:
   المفصلة على الشمال
   الكالون على اليمين
   لذلك الفتح يكون من الشمال للداخل */
.door{
    position:absolute;
    inset:12px;
    z-index:5;
    transform-origin:left center;
    background:linear-gradient(90deg,#25170c,#62401f 48%,#2b190d);
    border:1px solid rgba(212,167,44,.45);
    box-shadow:inset 0 0 35px rgba(0,0,0,.55);
    animation:openDoor 1.9s cubic-bezier(.65,0,.18,1) 3.55s forwards;
}

/* ديكور الباب */
.door:before,
.door:after{
    content:"";
    position:absolute;
    left:13%;
    right:13%;
    border:1px solid rgba(212,167,44,.25);
}
.door:before{top:12%;bottom:53%}
.door:after{top:56%;bottom:12%}

/* الكالون — ثابت ناحية اليمين */
.lock{
    position:absolute;
    z-index:15;
    right:28px;
    top:48%;
    width:48px;
    height:58px;
    transform:translateY(-50%);
    opacity:1;
    animation:lockDisappear .35s ease 4.15s forwards;
}

.lock-body{
    position:absolute;
    bottom:0;
    left:4px;
    width:40px;
    height:42px;
    border:4px solid var(--gold);
    border-radius:6px;
    background:#120c05;
}

.lock-ring{
    position:absolute;
    left:10px;
    top:0;
    width:24px;
    height:28px;
    border:4px solid var(--gold);
    border-bottom:0;
    border-radius:20px 20px 0 0;
}

.lock-hole{
    position:absolute;
    left:50%;
    top:54%;
    width:5px;
    height:15px;
    background:var(--gold);
    transform:translate(-50%,-50%);
}

/*
    المفتاح:
    رأس المفتاح ناحية الشمال
    السن ناحية اليمين
    يتحرك من الشمال إلى اليمين
    ليدخل في الكالون الموجود يمين الباب
*/
.key{
    position:absolute;
    z-index:30;
    left:50%;
    top:48%;
    width:145px;
    height:42px;
    opacity:1;
    filter:drop-shadow(0 0 13px rgba(212,167,44,.55));

    /* السن ناحية اليمين */
    transform:translate(-50%,-50%) rotate(0deg);

    animation:keyToLock 3.55s cubic-bezier(.25,.8,.2,1) forwards;
}

/* رأس المفتاح ناحية الشمال */
.key-head{
    position:absolute;
    left:0;
    top:0;
    width:42px;
    height:42px;
    border:6px solid var(--gold);
    border-radius:50%;
    background:#241707;
}

.key-head:after{
    content:"";
    position:absolute;
    left:50%;
    top:50%;
    width:11px;
    height:11px;
    border-radius:50%;
    border:3px solid var(--gold);
    transform:translate(-50%,-50%);
}

/* ساق المفتاح من الشمال لليمين */
.key-shaft{
    position:absolute;
    left:37px;
    top:16px;
    width:82px;
    height:10px;
    background:var(--gold);
    border-radius:5px;
}

/* سنون المفتاح ناحية اليمين */
.key-tooth{
    position:absolute;
    right:18px;
    top:25px;
    width:13px;
    height:16px;
    background:var(--gold);
}

.key-tooth.two{
    right:34px;
    top:25px;
    height:11px;
}

/* نور الشقة */
.warm-light{
    position:absolute;
    z-index:2;
    left:50%;
    top:48%;
    width:310px;
    height:520px;
    transform:translate(-50%,-50%);
    background:radial-gradient(ellipse,#ffd98a 0%,#9a641d 35%,transparent 70%);
    opacity:0;
    animation:lightOn .8s ease-out 4.45s forwards;
}

/* لقطة دخول الشقة */
.room{
    position:absolute;
    inset:0;
    z-index:1;
    opacity:0;
    transform:scale(.78);
    background:
        linear-gradient(rgba(10,5,0,.05),rgba(0,0,0,.25)),
        url("{% static 'images/booking-storyboard.png' %}");
    background-size:cover;
    background-position:center;
    animation:enterRoom 2.1s cubic-bezier(.2,.75,.2,1) 4.75s forwards;
}

/* المراحل */
.phase{
    position:absolute;
    z-index:50;
    left:50%;
    bottom:8%;
    transform:translateX(-50%);
    color:#f1d26b;
    font-size:14px;
    text-shadow:0 2px 14px #000;
    opacity:0;
    white-space:nowrap;
}

.phase.one{animation:phase 1.5s .1s forwards}
.phase.two{animation:phase 1.3s 2.5s forwards}
.phase.three{animation:phase 1.2s 4.45s forwards}

/* شريط التقدم */
.progress{
    position:absolute;
    z-index:51;
    left:50%;
    bottom:4.5%;
    transform:translateX(-50%);
    width:min(70vw,330px);
    height:4px;
    background:#303030;
    border-radius:10px;
    overflow:hidden;
}

.progress:after{
    content:"";
    display:block;
    height:100%;
    width:0;
    background:var(--gold);
    animation:progress 6.1s linear forwards;
}

/* رسالة النجاح */
.success{
    position:absolute;
    z-index:100;
    left:50%;
    top:50%;
    width:min(88vw,460px);
    padding:28px 22px;
    text-align:center;
    transform:translate(-50%,-50%) scale(.8);
    opacity:0;
    border:1px solid rgba(212,167,44,.85);
    border-radius:18px;
    background:rgba(4,4,4,.86);
    backdrop-filter:blur(10px);
    box-shadow:0 25px 80px #000,0 0 45px rgba(212,167,44,.12);
    animation:successIn 1s cubic-bezier(.2,.8,.2,1) 6.55s forwards;
}

.check{
    width:68px;
    height:68px;
    margin:0 auto 16px;
    border:2px solid var(--gold);
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    color:var(--gold);
    font-size:38px;
}

.success h1{
    color:var(--gold);
    font-size:27px;
    margin-bottom:10px;
}

.success p{
    color:#eee;
    line-height:1.9;
    font-size:14px;
}

.date{
    margin-top:12px;
    color:#bbb;
}

.home{
    display:block;
    margin-top:20px;
    padding:13px 20px;
    background:var(--gold);
    color:#000;
    border-radius:7px;
    text-decoration:none;
    font-weight:bold;
}

/* المفتاح يدخل من الشمال للكـالون ناحية اليمين */
@keyframes keyToLock{

    0%{
        left:calc(50% - 180px);
        top:48%;
        transform:translate(-50%,-50%) rotate(0deg);
    }

    42%{
        left:calc(50% + 55px);
        top:48%;
        transform:translate(-50%,-50%) rotate(0deg);
    }

    55%{
        left:calc(50% + 88px);
        top:48%;
        transform:translate(-50%,-50%) rotate(0deg);
    }

    /* لف المفتاح داخل الكالون */
    68%{
        left:calc(50% + 88px);
        top:48%;
        transform:translate(-50%,-50%) rotate(90deg);
    }

    78%{
        left:calc(50% + 88px);
        top:48%;
        transform:translate(-50%,-50%) rotate(90deg) scale(.85);
    }

    /* يختفي المفتاح بعد فتح الكالون */
    100%{
        left:calc(50% + 88px);
        top:48%;
        transform:translate(-50%,-50%) rotate(90deg) scale(.2);
        opacity:0;
    }
}

/* الباب يفتح من المفصلة اليسار */
@keyframes openDoor{
    0%{
        transform:perspective(1000px) rotateY(0deg);
    }

    100%{
        transform:perspective(1000px) rotateY(105deg);
    }
}

/* الكالون يختفي مع بداية فتح الباب */
@keyframes lockDisappear{
    0%{
        opacity:1;
        transform:translateY(-50%) scale(1);
    }

    100%{
        opacity:0;
        transform:translateY(-50%) scale(.35);
    }
}

@keyframes lightOn{
    0%{
        opacity:0;
        transform:translate(-50%,-50%) scale(.7);
    }

    100%{
        opacity:.85;
        transform:translate(-50%,-50%) scale(1);
    }
}

@keyframes enterRoom{
    0%{
        opacity:0;
        transform:scale(.78);
    }

    18%{
        opacity:1;
        transform:scale(.83);
    }

    100%{
        opacity:1;
        transform:scale(1.18);
    }
}

@keyframes phase{
    0%{
        opacity:0;
        transform:translate(-50%,10px);
    }

    20%,75%{
        opacity:1;
        transform:translate(-50%,0);
    }

    100%{
        opacity:0;
        transform:translate(-50%,-8px);
    }
}

@keyframes progress{
    to{width:100%}
}

@keyframes successIn{
    0%{
        opacity:0;
        transform:translate(-50%,-47%) scale(.78);
    }

    100%{
        opacity:1;
        transform:translate(-50%,-50%) scale(1);
    }
}

@media(max-width:600px){
    .door-frame{
        width:78vw;
        height:68vh;
    }

    .key{
        width:125px;
        height:38px;
    }

    .key-head{
        width:38px;
        height:38px;
    }

    .key-shaft{
        left:34px;
        width:72px;
    }

    .success{
        padding:24px 18px;
    }

    .success h1{
        font-size:24px;
    }
}
</style>
</head>

<body>

<div class="scene">

    <div class="entry"></div>

    <div class="warm-light"></div>

    <div class="room"></div>

    <div class="door-frame">

        <div class="door"></div>

        <!-- الكالون ناحية اليمين -->
        <div class="lock">
            <div class="lock-ring"></div>
            <div class="lock-body"></div>
            <div class="lock-hole"></div>
        </div>

    </div>

    <!-- المفتاح يدخل من الشمال -->
    <div class="key">
        <div class="key-head"></div>
        <div class="key-shaft"></div>
        <div class="key-tooth"></div>
        <div class="key-tooth two"></div>
    </div>

    <div class="phase one">جاري تجهيز دخولك...</div>
    <div class="phase two">جاري فتح الباب...</div>
    <div class="phase three">أهلًا بك...</div>

    <div class="progress"></div>

    <div class="success">

        <div class="check">✓</div>

        <h1>تم تأكيد الحجز بنجاح!</h1>

        <p>
            تم استلام طلب الحجز الخاص بك.<br>
            سيتم التواصل معك لتأكيد الموعد.
        </p>

        {% if booking_date %}
        <div class="date">
            📅 {{ booking_date }} &nbsp; | &nbsp; ⏰ {{ booking_time }}
        </div>
        {% endif %}

        <a class="home" href="/">
            العودة للرئيسية
        </a>

    </div>

</div>

</body>
</html>
